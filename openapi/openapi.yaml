          in: query
          schema:
            type: string
            enum: [daily, weekly, monthly, custom]
        - name: favorite
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Paginated list of recurring tasks
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessBody"
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
