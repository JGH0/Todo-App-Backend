    post:
      tags: [Recurring Tasks]
      summary: Create a recurring task
      operationId: createRecurringTask
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  maxLength: 255
                description:
                  type: string
                  nullable: true
                schedule:
                  type: string
                  enum: [daily, weekly, monthly, custom]
                  default: weekly
                custom_days:
                  type: array
                  items:
                    type: string
                    enum: [mon, tue, wed, thu, fri, sat, sun]
                  description: Active only when schedule=custom
                  example: [mon, wed, fri]
                favorite:
                  type: boolean
                  default: false
                category_id:
                  type: string
                  format: uuid
                  nullable: true
      responses:
        "201":
