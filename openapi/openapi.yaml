openapi: "3.0.3"
info:
  title: Todo App API
  description: |
    RESTful API for the Todo App backend. Provides user management, todo
    tracking with categories, projects, recurring tasks, activity logging,
    a theme marketplace, and JWT/ApiKey authentication.

    Base URL: `http://localhost:8080/api/v1`
  version: "1.0.0"
  contact:
    name: Todo App Team
  license:
    name: MIT

servers:
  - url: http://localhost:8080/api/v1
    description: Local development server

paths:
  # ──────────────────────────────────────────────────────────────────────────
  #  AUTHENTICATION
  # ──────────────────────────────────────────────────────────────────────────

  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a new user
      description: >
        Creates a new user account and returns the user data along with a
        newly generated API key. Store the API key securely — it will not
        be shown again.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email:
                  type: string
                  format: email
                  description: Must be unique in the system
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: Plain-text password (hashed with bcrypt on storage)
                name:
                  type: string
                  maxLength: 255
                avatar_url:
                  type: string
                  format: uri
                  nullable: true
                settings:
                  type: object
                  description: JSON-serialized user preferences
                  default: { theme: light }
                  properties:
                    theme:
                      type: string
                      example: dark
                    language:
                      type: string
                      example: en
              example:
                email: user@example.com
                password: securepass123
                name: John Doe
                avatar_url: https://example.com/avatar.jpg
                settings:
                  theme: dark
                  language: en
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User registered successfully
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
                      api_key:
                        type: string
                        description: Full API key (shown once only)
                      key_prefix:
                        type: string
                        example: todo_abc1
        "422":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /auth/login:
    post:
      tags: [Authentication]
      summary: Login with email and password
      description: >
        Authenticates a user and returns an API key. If the user already has
        an active API key, only the key prefix is returned (full key was
        shown on first creation).
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
              example:
                email: user@example.com
                password: securepass123
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Login successful
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          email:
                            type: string
                          name:
                            type: string
                      api_key:
                        type: string
                        description: Full API key (if new key was created)
                      api_key_prefix:
                        type: string
                        description: Key prefix when using an existing key
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/api-key:
    post:
      tags: [Authentication]
      summary: Create an additional API key (legacy)
      description: >
        Creates a new API key for an app or integration. Requires email and
        password for re-authentication.
      operationId: createApiKeyAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 6
                name:
                  type: string
                  description: User-friendly label for the key
                scopes:
                  type: array
                  items:
                    type: string
                    enum: [read, write]
                  description: >
                    Permission scopes. If omitted, grants full access.
                  example: [read, write]
                expires_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: ISO-8601 expiration date
              example:
                email: user@example.com
                password: securepass123
                name: My App Key
                scopes: [read, write]
      responses:
        "200":
          description: API key created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: API key created successfully
                  data:
                    $ref: "#/components/schemas/ApiKeyCreated"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /auth/jwt/register:
    post:
      tags: [Authentication]
      summary: Register and receive JWT + API key
      description: >
        Registers a new user and returns both a JWT token (for bearer auth)
        and an API key.
      operationId: jwtRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/requestBodies/UserRegistration"
      responses:
        "201":
          description: Registration successful with JWT
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User registered successfully
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
                      token:
                        type: string
                        description: JWT bearer token (valid 1 hour)
                      api_key:
                        type: string
                        description: Full API key value

  /auth/jwt/login:
    post:
      tags: [Authentication]
      summary: Login and receive JWT
      description: >
        Authenticates with email/password and returns a JWT bearer token.
      operationId: jwtLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Login successful with JWT
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          email:
                            type: string
                          name:
                            type: string
                      token:
                        type: string
                        description: JWT bearer token (valid 1 hour)

  /auth/jwt/refresh:
    post:
      tags: [Authentication]
      summary: Refresh JWT token
      description: >
        Obtains a new JWT token using a valid (not yet expired) bearer token.
      operationId: jwtRefresh
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      token:
                        type: string
        "401":
          description: Invalid or expired token

  # ──────────────────────────────────────────────────────────────────────────
  #  MARKETPLACE (public)
  # ──────────────────────────────────────────────────────────────────────────

  /marketplace/themes:
    get:
      tags: [Marketplace]
      summary: List all published marketplace themes
      description: Public endpoint — no authentication required.
      operationId: listMarketplaceThemes
      responses:
        "200":
          description: List of published themes
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MarketplaceTheme"

  /marketplace/themes/{id}:
    get:
      tags: [Marketplace]
      summary: Get a single marketplace theme
      operationId: getMarketplaceTheme
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Theme details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/MarketplaceTheme"
        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────────────────────────────────────────────────────────────────
  #  USER PROFILE
  # ──────────────────────────────────────────────────────────────────────────

  /user/profile:
    get:
      tags: [User]
      summary: Get authenticated user's profile
      description: Returns profile data for the user identified by the API key.
      operationId: getUserProfile
      security:
        - apiKeyAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [User]
      summary: Update the authenticated user's profile
      operationId: updateUserProfile
      security:
        - apiKeyAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                avatar_url:
                  type: string
                  format: uri
                  nullable: true
                settings:
                  type: object
                  description: User preferences (JSON)
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/User"

  /user/api-keys:
    get:
      tags: [User]
      summary: List all API keys for the authenticated user
      description: >
        Returns API key metadata (prefix, name, scopes, active status).
        The full key hash is never exposed.
      operationId: listApiKeys
      security:
        - apiKeyAuth: []
      responses:
        "200":
          description: List of API keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiKeyMetadata"
    post:
      tags: [User]
      summary: Create a new API key
      operationId: createApiKey
      security:
        - apiKeyAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: User-friendly label
                  default: API Key
                scopes:
                  type: array
                  items:
                    type: string
                    enum: [read, write]
                  default: [read, write]
                expires_at:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        "200":
          description: API key created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/ApiKeyCreated"

  /user/api-keys/{id}:
    delete:
      tags: [User]
      summary: Revoke an API key
      description: Permanently deactivates an API key.
      operationId: revokeApiKey
      security:
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Key revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: null
                    example: null
        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────────────────────────────────────────────────────────────────
  #  CATEGORIES
  # ──────────────────────────────────────────────────────────────────────────

  /categories:
    get:
      tags: [Categories]
      summary: List all categories for the authenticated user
      operationId: listCategories
      security:
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
        - $ref: "#/components/parameters/sort"
        - name: favorite
          in: query
          schema:
            type: boolean
          description: Filter by favorite status
      responses:
        "200":
          description: Paginated list of categories
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessBody"
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Category"
    post:
      tags: [Categories]
      summary: Create a new category
      operationId: createCategory
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, color]
              properties:
                name:
                  type: string
                  maxLength: 255
                color:
                  type: string
                  pattern: "^#[0-9a-fA-F]{6}$"
                  description: Hex colour code for UI
                  example: "#3B82F6"
                favorite:
                  type: boolean
                  default: false
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/Category"
        "409":
          description: A category with this name already exists for this user
        "422":
          $ref: "#/components/responses/ValidationError"

  /categories/{id}:
    get:
      tags: [Categories]
      summary: Get a single category
      operationId: getCategory
      security:
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Category details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/Category"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Categories]
      summary: Update a category
      operationId: updateCategory
      security:
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                color:
                  type: string
                  pattern: "^#[0-9a-fA-F]{6}$"
                favorite:
                  type: boolean
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/Category"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Categories]
      summary: Delete a category
      operationId: deleteCategory
      security:
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Category deleted
        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────────────────────────────────────────────────────────────────
  #  PROJECTS
  # ──────────────────────────────────────────────────────────────────────────

  /projects:
    get:
      tags: [Projects]
      summary: List all projects for the authenticated user
      operationId: listProjects
      security:
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
        - $ref: "#/components/parameters/sort"
      responses:
        "200":
          description: Paginated list of projects
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessBody"
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Project"
    post:
      tags: [Projects]
      summary: Create a new project
      operationId: createProject
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 255
                description:
                  type: string
                  nullable: true
                color:
                  type: string
                  pattern: "^#[0-9a-fA-F]{6}$"
                  default: "#8B5CF6"
                  example: "#8B5CF6"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/Project"
        "422":
          $ref: "#/components/responses/ValidationError"

  /projects/{id}:
    get:
      tags: [Projects]
      summary: Get a single project
      operationId: getProject
      security:
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Projects]
      summary: Update a project
      operationId: updateProject
      security:
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                description:
                  type: string
                  nullable: true
                color:
                  type: string
                  pattern: "^#[0-9a-fA-F]{6}$"
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Projects]
      summary: Delete a project
      operationId: deleteProject
      security:
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Project deleted
        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────────────────────────────────────────────────────────────────
  #  TODOS
  # ──────────────────────────────────────────────────────────────────────────

  /todos:
    get:
      tags: [Todos]
      summary: List todos with pagination, sorting, and filtering
      operationId: listTodos
      security:
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
        - $ref: "#/components/parameters/sort"
        - name: status
          in: query
          schema:
            type: string
            enum: [open, in_progress, completed, archived]
          description: Filter by status
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
        - name: sync_enabled
          in: query
          schema:
            type: boolean
        - name: reminder_enabled
          in: query
          schema:
            type: boolean
        - name: recurring_enabled
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Paginated list of todos (with linked categories)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessBody"
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Todo"
    post:
      tags: [Todos]
      summary: Create a new todo
      operationId: createTodo
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  maxLength: 255
                description:
                  type: string
                  nullable: true
                status:
                  type: string
                  enum: [open, in_progress, completed, archived]
                  default: open
                due_date:
                  type: string
                  format: date
                  nullable: true
                  example: "2025-01-15"
                due_time:
                  type: string
                  format: partial-time
                  nullable: true
                  example: "10:30:00"
                sync_enabled:
                  type: boolean
                  default: true
                reminder_enabled:
                  type: boolean
                  default: false
                recurring_enabled:
                  type: boolean
                  default: false
                project_id:
                  type: string
                  format: uuid
                  nullable: true
                category_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: >
                    Optional — link an existing category on creation
      responses:
        "201":
          description: Todo created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/Todo"
        "422":
          $ref: "#/components/responses/ValidationError"

  /todos/{id}:
    get:
      tags: [Todos]
      summary: Get a single todo
      operationId: getTodo
      security:
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Todo details (with linked categories)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/Todo"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Todos]
      summary: Update a todo
      operationId: updateTodo
      security:
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 255
                description:
                  type: string
                  nullable: true
                status:
                  type: string
                  enum: [open, in_progress, completed, archived]
                due_date:
                  type: string
                  format: date
                  nullable: true
                due_time:
                  type: string
                  format: partial-time
                  nullable: true
                sync_enabled:
                  type: boolean
                reminder_enabled:
                  type: boolean
                recurring_enabled:
                  type: boolean
                project_id:
                  type: string
                  format: uuid
                  nullable: true
                category_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: >
                    Replaces all category links with the given category
      responses:
        "200":
          description: Todo updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
