# Nginx config for the Todo App SPA
# - Serves the built Vue.js app
# - Proxies /api/ calls to the backend container (avoids CORS)
# - Fallback to index.html for Vue Router history mode

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ── API proxy ──────────────────────────────────────────────────────────
    # Forward /api/ requests to the backend container.
    # This keeps everything on the same origin (no CORS issues).
    location /api/ {
        proxy_pass http://todo-backend:80/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeout for long-running API calls
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_send_timeout    30s;

        # Pass through CORS headers from the backend
        proxy_pass_header Access-Control-Allow-Origin;
        proxy_pass_header Access-Control-Allow-Methods;
        proxy_pass_header Access-Control-Allow-Headers;
    }

    # ── Theme store proxy ─────────────────────────────────────────────────
    # Forward /index.php/ and /themes to the backend (same origin = no CORS).
    # The frontend's theme browser hits these endpoints.
    location ^~ /index.php/ {
        proxy_pass http://todo-backend:80/index.php/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_send_timeout    30s;
    }

    location ^~ /themes {
        proxy_pass http://todo-backend:80/themes;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_send_timeout    30s;
    }

    # ── SPA ────────────────────────────────────────────────────────────────
    # Vue Router history mode – fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static assets ──────────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
